<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KNSPACE Internal Web Application</title>
  <meta name="description" content="KNSPACE Internal Web Application Portal" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-wrapper {
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 5;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Loading KNSPACE Portal...</div>
    </div>

    <!-- Fullscreen Google Apps Script iFrame -->
    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbwHwP6hTcNYeQCr5eUeakq3zrISM81Ud7avbIcfviJWhTNPr50Dttdt-rUZtirlgHor/exec"
      allow="geolocation; microphone; camera; clipboard-write;"
      sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
      onload="hideLoader()"
    ></iframe>
  </div>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
